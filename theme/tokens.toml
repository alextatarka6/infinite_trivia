# Infinite Trivia — design tokens (single source of truth).
#
# "Roster" direction: esports-broadcast overlay in a Jackbox-style show frame.
# Flat fills only (no gradients, glows or rounded corners); shapes are chamfered
# polygons and slants. Reference: design/roster/Roster Hi-fi.dc.html (gitignored),
# drawn at 1280×800 — every size below is in that canvas space and scaled to
# the window at runtime (see kit::Canvas).
#
# build.rs reads this file and generates compile-time constants in
# $OUT_DIR/design_tokens.rs, which src/theme.rs includes. Edit values here,
# not in theme.rs. The phone controller (assets/phone.html) mirrors the colors.

# ---------------------------------------------------------------------------
# Solid colors  (hex -> Color32::from_rgb).  Comment = the theme.rs const name.
# ---------------------------------------------------------------------------
[color]
bg       = "#0a1140"   # BG        — screen background
panel    = "#0d1657"   # PANEL     — cards, segments, roster cards
panel_hi = "#13256f"   # PANEL_HI  — live board tiles, photo plates, inactive progress
gold     = "#f4b63f"   # GOLD      — accent, selected state, active team, primary buttons
gold_hi  = "#ffd884"   # GOLD_HI   — gold hover / pressed
on_gold  = "#1a1304"   # ON_GOLD   — text and icons on gold
ink      = "#f7f5ee"   # INK       — primary text
muted    = "#aab3e4"   # MUTED     — labels, secondary text
good     = "#5ec98a"   # GOOD      — correct
on_good  = "#0c1a10"   # ON_GOOD   — text on good
bad      = "#e8627a"   # BAD       — wrong, negative scores
on_bad   = "#2a0c11"   # ON_BAD    — text on bad

# ---------------------------------------------------------------------------
# Alpha-composited colors.  base color + alpha -> premultiplied Color32.
# ---------------------------------------------------------------------------
[color_alpha]
line = { base = "#aab3e4", alpha = 0.18 }   # LINE — hairline dividers

# ---------------------------------------------------------------------------
# Design canvas (px) -> CANVAS_*. Screens are laid out in this space.
# ---------------------------------------------------------------------------
[canvas]
w = 1280.0
h = 800.0

# ---------------------------------------------------------------------------
# Shape (px) -> CHAMFER_* / SLANT_*. No rounded corners anywhere (icon aside).
#   Chamfer pattern A = top-left + bottom-right (buttons, tiles, photo plates)
#   Chamfer pattern B = bottom-right only (roster / team cards)
# ---------------------------------------------------------------------------
[chamfer]
sm = 6.0    # chips, segments
md = 10.0   # tiles, buttons, photo plates
lg = 14.0   # roster cards

[slant]
card = 24.0   # Home mode cards (parallelogram offset)
tag  = 11.0   # tag labels: ROUND 1, $800, TOSSUP 7

# ---------------------------------------------------------------------------
# Mode textures: line pitch (px) and alpha of MUTED. -> TEXTURE_*
# The same textures sit behind each mode's question screen at `screen_alpha`.
# ---------------------------------------------------------------------------
[texture]
grid_pitch    = 28.0   # Jeopardy — square grid
grid_alpha    = 0.10
hatch_pitch   = 12.0   # General Trivia — 45° hatch
hatch_alpha   = 0.09
scan_pitch    = 7.0    # Quizbowl — horizontal scanlines
scan_alpha    = 0.10
checker_pitch = 28.0   # Mix — checker
checker_alpha = 0.07
screen_alpha  = 0.05   # full-screen background version

# ---------------------------------------------------------------------------
# Spacing (px) -> SPACE_*
# ---------------------------------------------------------------------------
[spacing]
item   = 8.0    # default egui item spacing
gutter = 48.0   # screen edge margin (Home, top bars)
gap    = 6.0    # board grid / roster card gap
seg    = 4.0    # segmented-control gap

# ---------------------------------------------------------------------------
# Type scale (px) -> TYPE_*.  Families are loaded by file in src/app.rs:
#   Barlow Condensed 500/600/700/800 — headlines, numbers, labels, buttons (caps)
#   Barlow 400/500/600               — body, descriptions, tossup text
# ---------------------------------------------------------------------------
[type]
wordmark   = 34.0    # INFINITE TRIVIA
mode_hero  = 104.0   # selected Home mode name
mode_name  = 46.0    # unselected Home mode name
label      = 12.0    # tracked caps labels (DIFFICULTY, ON THE COUCH)
segment    = 15.0    # segmented control
button     = 22.0    # primary / secondary buttons
tag        = 16.0    # slanted tags
clue       = 56.0    # Jeopardy clue / trivia question
qb_text    = 34.0    # tossup reading text
tile_value = 40.0    # board $ values
category   = 15.0    # board category headers
score      = 52.0    # roster score (inactive)
score_hi   = 72.0    # roster score (active)
body       = 18.0    # descriptions
